{# For pages with no user menu to hang a language off — the landing page, login
   and pricing. Those are the public ones, which is where a visitor arriving
   from a search in their own language actually needs it. #}
<nav class="lang-inline" aria-label="{{ _('Language') }}">
  {% for l in language_links %}
  <a href="{{ l.href }}" hreflang="{{ l.code }}"
     class="{% if l.current %}is-current{% endif %}"
     {% if l.current %}aria-current="true"{% endif %}>{{ l.name }}</a>
  {% endfor %}
</nav>
