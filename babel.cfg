# What pybabel reads when building the catalogue.
#
# Admin templates are absent on purpose rather than filtered afterwards: those
# pages are operational and read by whoever runs the server, and leaving them
# out here means a new admin page can't quietly enlarge the translation bill.
[python: app/**.py]

[jinja2: app/templates/*.html]
extensions=jinja2.ext.i18n

[jinja2: app/templates/_*.html]
extensions=jinja2.ext.i18n
