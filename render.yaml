services:
  - type: web
    name: website-word-counter
    env: docker
    plan: pro
    dockerfilePath: ./Dockerfile
    healthCheckPath: /login
    envVars:
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DB_PATH
        value: /var/data/wordcount.db
      - key: MEMORY_LIMIT_MB
        value: "3200"
      - key: MAILGUN_API_KEY
        sync: false
      - key: MAILGUN_DOMAIN
        sync: false
      - key: PUBLIC_BASE_URL
        value: https://wordcounter.wxrks.app
      - key: ADMIN_EMAILS
        sync: false
      # Both products are served by this one service, chosen by Host header
      # (app/surfaces.py). Add the second domain to THIS service — a separate
      # instance can't share the job state or the Markdown volume.
      - key: COUNTER_HOST
        value: wordcounter.wxrks.app
      - key: MARKDOWN_HOST
        value: markdown.wxrks.app
      # A finished, public run to show on each landing page. Unset just hides
      # the button.
      - key: COUNTER_DEMO_RUN_ID
        sync: false
      - key: MARKDOWN_DEMO_RUN_ID
        sync: false
      # Saved page Markdown, under DB_PATH's directory unless overridden.
      # Capture stops on its own before the volume gets tight — the database
      # lives on the same disk, so filling it would take the whole app down.
      - key: MARKDOWN_MAX_RUN_MB
        value: "300"
      - key: MARKDOWN_MAX_TOTAL_MB
        value: "6000"
      - key: MARKDOWN_DISK_FLOOR_MB
        value: "512"
    disk:
      name: wordcounter-data
      mountPath: /var/data
      # Shared by the SQLite database and saved Markdown. Markdown for a single
      # very large crawl is ~600-700MB, so 1GB could not hold one. Render disks
      # can be grown later but never shrunk.
      sizeGB: 10
